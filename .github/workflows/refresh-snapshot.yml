name: Refresh published snapshot

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: published-snapshot
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Fetch privately and export country aggregates
        env:
          AA_API_KEY: ${{ secrets.AA_API_KEY }}
        run: python scripts/publish_snapshot.py
      - name: Commit only the public derived feed
        shell: bash
        run: |
          git add reports/latest.json reports/latest-summary.md
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh published country-level comparison'
          git push
